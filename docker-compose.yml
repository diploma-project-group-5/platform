# Інфраструктура «Лад»: PostgreSQL, Kafka, шлюз Traefik, Keycloak.
# Запуск: make up (див. README.md). Сервіси додаються окремими картками.

name: lad

services:
  postgres:
    image: postgres:16.15
    container_name: lad-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_SUPERUSER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?задайте POSTGRES_SUPERUSER_PASSWORD у .env}
      POSTGRES_DB: postgres
      TZ: UTC
    ports:
      # Лише localhost: ззовні ВМ база недоступна.
      - "127.0.0.1:${PG_PORT:-5432}:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    networks: [lad]

  # Одноразовий контейнер: створює ролі й бази (db-init/init.sh) і завершується.
  # Запускається при кожному make up, скрипт ідемпотентний.
  db-init:
    image: postgres:16.15
    container_name: lad-db-init
    restart: "no"
    entrypoint: ["bash", "/db-init/init.sh"]
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_SUPERUSER:-postgres}
      PGPASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?задайте POSTGRES_SUPERUSER_PASSWORD у .env}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?задайте KEYCLOAK_DB_PASSWORD у .env}
      TENANT_OWNER_DB_PASSWORD: ${TENANT_OWNER_DB_PASSWORD:?задайте TENANT_OWNER_DB_PASSWORD у .env}
      TENANT_APP_DB_PASSWORD: ${TENANT_APP_DB_PASSWORD:?задайте TENANT_APP_DB_PASSWORD у .env}
      TENANT_RELAY_DB_PASSWORD: ${TENANT_RELAY_DB_PASSWORD:?задайте TENANT_RELAY_DB_PASSWORD у .env}
      TENANT_MAINT_DB_PASSWORD: ${TENANT_MAINT_DB_PASSWORD:?задайте TENANT_MAINT_DB_PASSWORD у .env}
    volumes:
      - ./db-init:/db-init:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks: [lad]

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    container_name: lad-keycloak
    restart: unless-stopped
    # --import-realm імпортує keycloak/realm/lad-realm.json лише якщо realm lad ще немає.
    # Змінили файл realm — make kc-reset.
    command: ["start", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?задайте KEYCLOAK_DB_PASSWORD у .env}
      # Keycloak живе за шлюзом під /idp. Публічна адреса потрапляє в токени як iss.
      KC_HTTP_ENABLED: "true"
      KC_HTTP_RELATIVE_PATH: /idp
      KC_HOSTNAME: ${LAD_PUBLIC_URL:-http://localhost}/idp
      KC_PROXY_HEADERS: xforwarded
      # Адмін-консоль — лише напряму на 127.0.0.1 (на ВМ через SSH-тунель); шлюз її не пропускає.
      KC_HOSTNAME_ADMIN: http://localhost:${KC_ADMIN_PORT:-8180}/idp
      KC_HEALTH_ENABLED: "true"
      # Адмін realm master для консолі.
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD:?задайте KC_ADMIN_PASSWORD у .env}
      # Значення для плейсхолдерів у lad-realm.json.
      LAD_PUBLIC_URL: ${LAD_PUBLIC_URL:-http://localhost}
      SYSADMIN_PASSWORD: ${SYSADMIN_PASSWORD:?задайте SYSADMIN_PASSWORD у .env}
      DEMO_SCHEDULER_PASSWORD: ${DEMO_SCHEDULER_PASSWORD:?задайте DEMO_SCHEDULER_PASSWORD у .env}
      DEMO_SCHOOL_ID: ${DEMO_SCHOOL_ID:?задайте DEMO_SCHOOL_ID у .env}
      TENANT_CLIENT_SECRET: ${TENANT_CLIENT_SECRET:?задайте TENANT_CLIENT_SECRET у .env}
    ports:
      - "127.0.0.1:${KC_ADMIN_PORT:-8180}:8080"
    volumes:
      - ./keycloak/realm:/opt/keycloak/data/import:ro
    healthcheck:
      # Готовність — за HTTP-кодом (200/503), а не за текстом: «UP» є й у вкладених перевірках.
      # Чистий bash: /dev/tcp, printf, read і [[ ]] вбудовані; curl, head, grep в образі Keycloak може не бути.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /idp/health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && read -r status <&3 && [[ $$status == *' 200 '* ]]"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    depends_on:
      db-init:
        condition: service_completed_successfully
    networks: [lad]

  kafka:
    image: apache/kafka:4.3.2
    container_name: lad-kafka
    restart: unless-stopped
    environment:
      # Один вузол у режимі KRaft: брокер і контролер в одному процесі, без ZooKeeper.
      CLUSTER_ID: ${KAFKA_CLUSTER_ID:-TX4v_oipS5WiDI8HDaVfvw}
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # INTERNAL — для контейнерів у мережі compose (kafka:9092),
      # EXTERNAL — для сервісів, запущених на хості (localhost:29092).
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:${KAFKA_EXTERNAL_PORT:-29092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      # Топіки створює лише kafka-init (окрема картка), не випадковий споживач.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      # Строк зберігання за замовчуванням — 7 днів (рішення 66); DLQ — 14 днів на рівні топіка.
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx768m"
    ports:
      - "127.0.0.1:${KAFKA_EXTERNAL_PORT:-29092}:29092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 15s
      retries: 12
      start_period: 30s
    networks: [lad]

  traefik:
    image: traefik:v3.7.17
    container_name: lad-traefik
    restart: unless-stopped
    command: ["--configFile=/etc/traefik/traefik.yml"]
    environment:
      # Куди шлюз веде запити. За замовчуванням — на сервіси, запущені на хості
      # (npm run dev). Коли сервіс з'явиться в compose, тут буде http://<сервіс>:8080.
      WEB_UPSTREAM: ${WEB_UPSTREAM:-http://host.docker.internal:5173}
      KEYCLOAK_UPSTREAM: ${KEYCLOAK_UPSTREAM:-http://keycloak:8080}
      TENANT_UPSTREAM: ${TENANT_UPSTREAM:-http://host.docker.internal:3001}
      SCHOOL_UPSTREAM: ${SCHOOL_UPSTREAM:-http://host.docker.internal:3002}
      TIMETABLE_UPSTREAM: ${TIMETABLE_UPSTREAM:-http://host.docker.internal:3003}
    ports:
      - "${HTTP_PORT:-80}:80"
    extra_hosts:
      # На macOS host.docker.internal є й так; на Linux (ВМ) його треба оголосити.
      - "host.docker.internal:host-gateway"
    volumes:
      - ./traefik:/etc/traefik:ro
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--configFile=/etc/traefik/traefik.yml"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 5s
    networks: [lad]

volumes:
  pg-data:
  kafka-data:

networks:
  lad:
    name: lad
