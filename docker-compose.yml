# Інфраструктура «Лад»: PostgreSQL, Kafka, шлюз Traefik, Keycloak.
# Запуск: make up (див. README.md). Сервіси додаються окремими картками.

name: lad

services:
  postgres:
    image: postgres:16.15
    container_name: lad-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_SUPERUSER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?задайте POSTGRES_SUPERUSER_PASSWORD у .env}
      POSTGRES_DB: postgres
      TZ: UTC
    ports:
      # Лише localhost: ззовні ВМ база недоступна.
      - "127.0.0.1:${PG_PORT:-5432}:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    networks: [lad]

  # Одноразовий контейнер: створює ролі й бази (db-init/init.sh) і завершується.
  # Запускається при кожному make up, скрипт ідемпотентний.
  db-init:
    image: postgres:16.15
    container_name: lad-db-init
    restart: "no"
    entrypoint: ["bash", "/db-init/init.sh"]
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_SUPERUSER:-postgres}
      PGPASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?задайте POSTGRES_SUPERUSER_PASSWORD у .env}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?задайте KEYCLOAK_DB_PASSWORD у .env}
      TENANT_OWNER_DB_PASSWORD: ${TENANT_OWNER_DB_PASSWORD:?задайте TENANT_OWNER_DB_PASSWORD у .env}
      TENANT_APP_DB_PASSWORD: ${TENANT_APP_DB_PASSWORD:?задайте TENANT_APP_DB_PASSWORD у .env}
      TENANT_RELAY_DB_PASSWORD: ${TENANT_RELAY_DB_PASSWORD:?задайте TENANT_RELAY_DB_PASSWORD у .env}
      TENANT_MAINT_DB_PASSWORD: ${TENANT_MAINT_DB_PASSWORD:?задайте TENANT_MAINT_DB_PASSWORD у .env}
      SCHOOL_OWNER_DB_PASSWORD: ${SCHOOL_OWNER_DB_PASSWORD:?задайте SCHOOL_OWNER_DB_PASSWORD у .env}
      SCHOOL_APP_DB_PASSWORD: ${SCHOOL_APP_DB_PASSWORD:?задайте SCHOOL_APP_DB_PASSWORD у .env}
      SCHOOL_RELAY_DB_PASSWORD: ${SCHOOL_RELAY_DB_PASSWORD:?задайте SCHOOL_RELAY_DB_PASSWORD у .env}
      SCHOOL_MAINT_DB_PASSWORD: ${SCHOOL_MAINT_DB_PASSWORD:?задайте SCHOOL_MAINT_DB_PASSWORD у .env}
      TIMETABLE_OWNER_DB_PASSWORD: ${TIMETABLE_OWNER_DB_PASSWORD:?задайте TIMETABLE_OWNER_DB_PASSWORD у .env}
      TIMETABLE_APP_DB_PASSWORD: ${TIMETABLE_APP_DB_PASSWORD:?задайте TIMETABLE_APP_DB_PASSWORD у .env}
      TIMETABLE_RELAY_DB_PASSWORD: ${TIMETABLE_RELAY_DB_PASSWORD:?задайте TIMETABLE_RELAY_DB_PASSWORD у .env}
      TIMETABLE_MAINT_DB_PASSWORD: ${TIMETABLE_MAINT_DB_PASSWORD:?задайте TIMETABLE_MAINT_DB_PASSWORD у .env}
    volumes:
      - ./db-init:/db-init:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks: [lad]

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    container_name: lad-keycloak
    restart: unless-stopped
    # --import-realm імпортує keycloak/realm/lad-realm.json лише якщо realm lad ще немає.
    # Змінили файл realm — make kc-reset.
    command: ["start", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?задайте KEYCLOAK_DB_PASSWORD у .env}
      # Keycloak живе за шлюзом під /idp. Публічна адреса потрапляє в токени як iss.
      KC_HTTP_ENABLED: "true"
      KC_HTTP_RELATIVE_PATH: /idp
      KC_HOSTNAME: ${LAD_PUBLIC_URL:-http://localhost}/idp
      KC_PROXY_HEADERS: xforwarded
      # Адмін-консоль — лише напряму на 127.0.0.1 (на ВМ через SSH-тунель); шлюз її не пропускає.
      KC_HOSTNAME_ADMIN: http://localhost:${KC_ADMIN_PORT:-8180}/idp
      KC_HEALTH_ENABLED: "true"
      # Адмін realm master для консолі.
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD:?задайте KC_ADMIN_PASSWORD у .env}
      # Значення для плейсхолдерів у lad-realm.json.
      LAD_PUBLIC_URL: ${LAD_PUBLIC_URL:-http://localhost}
      SYSADMIN_PASSWORD: ${SYSADMIN_PASSWORD:?задайте SYSADMIN_PASSWORD у .env}
      DEMO_SCHEDULER_PASSWORD: ${DEMO_SCHEDULER_PASSWORD:?задайте DEMO_SCHEDULER_PASSWORD у .env}
      DEMO_SCHOOL_ID: ${DEMO_SCHOOL_ID:?задайте DEMO_SCHOOL_ID у .env}
      TENANT_CLIENT_SECRET: ${TENANT_CLIENT_SECRET:?задайте TENANT_CLIENT_SECRET у .env}
    ports:
      - "127.0.0.1:${KC_ADMIN_PORT:-8180}:8080"
    volumes:
      - ./keycloak/realm:/opt/keycloak/data/import:ro
    healthcheck:
      # Готовність — за HTTP-кодом (200/503), а не за текстом: «UP» є й у вкладених перевірках.
      # Чистий bash: /dev/tcp, printf, read і [[ ]] вбудовані; curl, head, grep в образі Keycloak може не бути.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /idp/health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && read -r status <&3 && [[ $$status == *' 200 '* ]]"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    depends_on:
      db-init:
        condition: service_completed_successfully
    networks: [lad]

  kafka:
    image: apache/kafka:4.3.2
    container_name: lad-kafka
    restart: unless-stopped
    environment:
      # Один вузол у режимі KRaft: брокер і контролер в одному процесі, без ZooKeeper.
      CLUSTER_ID: ${KAFKA_CLUSTER_ID:-TX4v_oipS5WiDI8HDaVfvw}
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # INTERNAL — для контейнерів у мережі compose (kafka:9092),
      # EXTERNAL — для сервісів, запущених на хості (localhost:29092).
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:${KAFKA_EXTERNAL_PORT:-29092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      # Топіки створює лише kafka-init (окрема картка), не випадковий споживач.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      # Строк зберігання за замовчуванням — 7 днів (рішення 66); DLQ — 14 днів на рівні топіка.
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx768m"
    ports:
      - "127.0.0.1:${KAFKA_EXTERNAL_PORT:-29092}:29092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 15s
      retries: 12
      start_period: 30s
    networks: [lad]

  # Одноразовий контейнер: створює топіки й <топік>.dlq (kafka-init/init.sh) і завершується.
  # Запускається при кожному make up, скрипт ідемпотентний.
  kafka-init:
    image: apache/kafka:4.3.2
    container_name: lad-kafka-init
    restart: "no"
    entrypoint: ["bash", "/kafka-init/init.sh"]
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
    volumes:
      - ./kafka-init:/kafka-init:ro
    depends_on:
      kafka:
        condition: service_healthy
    networks: [lad]

  # Kafka-воркер CP-SAT (репо solver; фрагмент — solver/deploy/compose.solver.yml).
  # Вмикається профілем: COMPOSE_PROFILES=solver у .env. Поки образу немає в реєстрі,
  # compose збирає його з сусідньої папки ../solver (SOLVER_SRC).
  solver:
    profiles: [solver]
    image: ${SOLVER_IMAGE:-lad-solver:local}
    build: ${SOLVER_SRC:-../solver}
    container_name: lad-solver
    command: ["worker"]
    init: true                    # SIGTERM доходить до воркера; зомбі-процеси прибираються
    restart: unless-stopped       # exit 1 (фатальна помилка Kafka, сторож) -> перезапуск
    stop_grace_period: 30s        # SIGTERM -> зупинка CP-SAT -> публікація найкращого розв'язку -> exit 0
    # ВМ має 2 vCPU: Docker не дає більше, ніж є на хості, а ~0.5 CPU лишається API, Kafka
    # і PostgreSQL. 2 потоки CP-SAT на 1.5 CPU — найкраща якість за замірами (ADR solver 2026-11-08).
    cpus: 1.5
    # Пік — 222 МБ на закладі з 45 класів. CP-SAT обмежено SOLVER_MAX_MEMORY_MB (~0.7 x mem_limit):
    # на межі він віддає найкращий розв'язок, а не падає через OOM.
    mem_limit: 768m
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SOLVER_GROUP_ID: lad-solver
      SOLVER_BUILD_TOPIC: solve.build.requested
      SOLVER_STATUS_TOPIC: solve.status
      SOLVER_BUILD_DLQ_TOPIC: solve.build.requested.dlq
      SOLVER_MIN_TIME_LIMIT_S: "10"
      SOLVER_MAX_TIME_LIMIT_S: "180"
      SOLVER_NUM_WORKERS: "2"
      SOLVER_SEED: "0"
      SOLVER_STOP_GRACE_S: "20"         # < stop_grace_period: лишає час опублікувати й закритися
      SOLVER_STOP_FLUSH_TIMEOUT_S: "4"
      SOLVER_SHUTDOWN_BUDGET_S: "29"    # grace + 2 x flush + 1 с; < stop_grace_period
      SOLVER_MAX_MEMORY_MB: "512"
      SOLVER_WATCHDOG_MARGIN_S: "60"
      # Рання зупинка без покращення: 0 — вимкнено. Ставити 8, коли timetable-service
      # прийматиме stop_reason "no_improvement" (contracts v0.2.0).
      SOLVER_STALL_MIN_S: ${SOLVER_STALL_MIN_S:-0}
      SOLVER_STALL_RATIO: "1.0"
      SOLVER_HEARTBEAT_FILE: /tmp/lad-solver.alive
      KAFKA_MAX_POLL_INTERVAL_MS: "300000"  # > (макс. ліміт 180 с + запас сторожа 60 с) x 1000
      KAFKA_SESSION_TIMEOUT_MS: "10000"
      KAFKA_HEARTBEAT_INTERVAL_MS: "3000"
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    # Портів немає: HTTP у воркера немає; стан — HEALTHCHECK образу за файлом-пульсом.
    networks: [lad]

  # --- Сервіси «Лад» (профіль apps) ------------------------------------------------------------
  # Без профілю make up піднімає лише інфраструктуру, а сервіси запускаються на хості (make dev у
  # їхніх репозиторіях). make up-apps вмикає профіль apps і перемикає шлюз на ці контейнери.
  # Поки образів немає в реєстрі, compose збирає їх із сусідніх клонів (../tenant-service тощо).

  # Міграції tenant окремим одноразовим контейнером під роллю tenant_owner (розділ 03), з того самого
  # образу, що й сервіс. Сервіс стартує лише після успішної міграції.
  tenant-migrate:
    profiles: [apps]
    image: ${TENANT_IMAGE:-lad-tenant-service:local}
    build: ${TENANT_SRC:-../tenant-service}
    container_name: lad-tenant-migrate
    restart: "no"
    command: ["node", "dist/migrate.js"]
    environment:
      MIGRATION_DATABASE_URL: postgres://tenant_owner:${TENANT_OWNER_DB_PASSWORD}@postgres:5432/tenant
    depends_on:
      db-init:
        condition: service_completed_successfully
    networks: [lad]

  tenant-service:
    profiles: [apps]
    image: ${TENANT_IMAGE:-lad-tenant-service:local}
    build: ${TENANT_SRC:-../tenant-service}
    container_name: lad-tenant-service
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      PORT: "3001"
      DATABASE_URL: postgres://tenant_app:${TENANT_APP_DB_PASSWORD}@postgres:5432/tenant
      RELAY_DATABASE_URL: postgres://tenant_relay:${TENANT_RELAY_DB_PASSWORD}@postgres:5432/tenant
      MAINT_DATABASE_URL: postgres://tenant_maint:${TENANT_MAINT_DB_PASSWORD}@postgres:5432/tenant
      # iss у токенах — публічна адреса (як бачить браузер); ключі — внутрішньою мережею.
      OIDC_ISSUER: ${LAD_PUBLIC_URL:-http://localhost}/idp/realms/lad
      OIDC_JWKS_URL: http://keycloak:8080/idp/realms/lad/protocol/openid-connect/certs
      # Admin API Keycloak — напряму, повз шлюз (шлюз закриває /idp/admin).
      KEYCLOAK_URL: http://keycloak:8080/idp
      TENANT_CLIENT_SECRET: ${TENANT_CLIENT_SECRET:?задайте TENANT_CLIENT_SECRET у .env}
      KAFKA_BROKERS: kafka:9092
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    depends_on:
      tenant-migrate:
        condition: service_completed_successfully
      keycloak:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    networks: [lad]

  # Міграції school окремим одноразовим контейнером під роллю school_owner (розділ 03), з того самого
  # образу, що й сервіс. Сервіс стартує лише після успішної міграції.
  school-migrate:
    profiles: [apps]
    image: ${SCHOOL_IMAGE:-lad-school-service:local}
    build: ${SCHOOL_SRC:-../school-service}
    container_name: lad-school-migrate
    restart: "no"
    command: ["node", "dist/migrate.js"]
    environment:
      MIGRATION_DATABASE_URL: postgres://school_owner:${SCHOOL_OWNER_DB_PASSWORD}@postgres:5432/school
    depends_on:
      db-init:
        condition: service_completed_successfully
    networks: [lad]

  school-service:
    profiles: [apps]
    image: ${SCHOOL_IMAGE:-lad-school-service:local}
    build: ${SCHOOL_SRC:-../school-service}
    container_name: lad-school-service
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      PORT: "3002"
      # /internal/v1 (знімок для timetable) — лише мережа compose; шлюз сюди не веде, порт не публікується.
      INTERNAL_PORT: "3102"
      DATABASE_URL: postgres://school_app:${SCHOOL_APP_DB_PASSWORD}@postgres:5432/school
      RELAY_DATABASE_URL: postgres://school_relay:${SCHOOL_RELAY_DB_PASSWORD}@postgres:5432/school
      MAINT_DATABASE_URL: postgres://school_maint:${SCHOOL_MAINT_DB_PASSWORD}@postgres:5432/school
      # iss у токенах — публічна адреса (як бачить браузер); ключі — внутрішньою мережею.
      OIDC_ISSUER: ${LAD_PUBLIC_URL:-http://localhost}/idp/realms/lad
      OIDC_JWKS_URL: http://keycloak:8080/idp/realms/lad/protocol/openid-connect/certs
      KAFKA_BROKERS: kafka:9092
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    depends_on:
      school-migrate:
        condition: service_completed_successfully
      kafka-init:
        condition: service_completed_successfully
    networks: [lad]

  # Міграції timetable окремим одноразовим контейнером під роллю timetable_owner (розділ 03), з того самого
  # образу, що й сервіс. Сервіс стартує лише після успішної міграції.
  timetable-migrate:
    profiles: [apps]
    image: ${TIMETABLE_IMAGE:-lad-timetable-service:local}
    build: ${TIMETABLE_SRC:-../timetable-service}
    container_name: lad-timetable-migrate
    restart: "no"
    command: ["node", "dist/migrate.js"]
    environment:
      MIGRATION_DATABASE_URL: postgres://timetable_owner:${TIMETABLE_OWNER_DB_PASSWORD}@postgres:5432/timetable
    depends_on:
      db-init:
        condition: service_completed_successfully
    networks: [lad]

  timetable-service:
    profiles: [apps]
    image: ${TIMETABLE_IMAGE:-lad-timetable-service:local}
    build: ${TIMETABLE_SRC:-../timetable-service}
    container_name: lad-timetable-service
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      PORT: "3003"
      DATABASE_URL: postgres://timetable_app:${TIMETABLE_APP_DB_PASSWORD}@postgres:5432/timetable
      RELAY_DATABASE_URL: postgres://timetable_relay:${TIMETABLE_RELAY_DB_PASSWORD}@postgres:5432/timetable
      MAINT_DATABASE_URL: postgres://timetable_maint:${TIMETABLE_MAINT_DB_PASSWORD}@postgres:5432/timetable
      # iss у токенах — публічна адреса (як бачить браузер); ключі — внутрішньою мережею.
      OIDC_ISSUER: ${LAD_PUBLIC_URL:-http://localhost}/idp/realms/lad
      OIDC_JWKS_URL: http://keycloak:8080/idp/realms/lad/protocol/openid-connect/certs
      # Єдиний прямий виклик між сервісами: знімок даних закладу в school (розділ 03).
      SCHOOL_INTERNAL_URL: http://school-service:3102
      QR_HMAC_SECRET: ${QR_HMAC_SECRET:?задайте QR_HMAC_SECRET у .env}
      PUBLIC_URL: ${LAD_PUBLIC_URL:-http://localhost}
      KAFKA_BROKERS: kafka:9092
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    depends_on:
      timetable-migrate:
        condition: service_completed_successfully
      school-service:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    networks: [lad]

  traefik:
    image: traefik:v3.7.17
    container_name: lad-traefik
    restart: unless-stopped
    command: ["--configFile=/etc/traefik/traefik.yml"]
    environment:
      # Куди шлюз веде запити. За замовчуванням — на сервіси, запущені на хості (make dev).
      # make up-apps перемикає tenant, school і timetable на контейнери профілю apps.
      WEB_UPSTREAM: ${WEB_UPSTREAM:-http://host.docker.internal:5173}
      KEYCLOAK_UPSTREAM: ${KEYCLOAK_UPSTREAM:-http://keycloak:8080}
      TENANT_UPSTREAM: ${TENANT_UPSTREAM:-http://host.docker.internal:3001}
      SCHOOL_UPSTREAM: ${SCHOOL_UPSTREAM:-http://host.docker.internal:3002}
      TIMETABLE_UPSTREAM: ${TIMETABLE_UPSTREAM:-http://host.docker.internal:3003}
    ports:
      - "${HTTP_PORT:-80}:80"
    extra_hosts:
      # На macOS host.docker.internal є й так; на Linux (ВМ) його треба оголосити.
      - "host.docker.internal:host-gateway"
    volumes:
      - ./traefik:/etc/traefik:ro
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--configFile=/etc/traefik/traefik.yml"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 5s
    networks: [lad]

volumes:
  pg-data:
  kafka-data:

networks:
  lad:
    name: lad
