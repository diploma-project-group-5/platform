# Сторінки помилок шлюзу у форматі problem+json (розділ 07: усі помилки — application/problem+json).
# Traefik (middleware errors) бере звідси тіло відповіді, а код лишає з оригінальної відповіді (429).
server {
    listen 8080;
    server_tokens off;
    root /usr/share/nginx/html;

    location = /429.json {
        types { }
        default_type application/problem+json;
        add_header Cache-Control "no-store" always;
    }

    location / {
        return 404;
    }
}
