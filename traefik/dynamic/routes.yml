# Маршрути шлюзу (розділ 07 специфікації).
# Адреси сервісів беруться зі змінних середовища контейнера traefik (див. docker-compose.yml).
# Префікс шляху не зрізається: сервіс отримує запит разом з /api/v1/<сервіс>.

http:
  routers:
    # Усе, що не API й не /idp, — застосунок web. Крім /internal: внутрішні маршрути сервісів
    # (/internal/v1/…) захищені лише мережею compose, тож шлюз не має й натяку на них — на
    # /internal немає жодного маршруту, і Traefik сам відповідає 404 (platform #17).
    web:
      rule: 'PathPrefix(`/`) && !PathRegexp(`(?i)^/+internal(/|$)`)'
      priority: 1
      entryPoints: [web]
      service: web
      middlewares: [security-headers]

    idp:
      rule: "PathPrefix(`/idp`)"
      priority: 100
      entryPoints: [web]
      service: keycloak

    # Адмін-консоль, realm master і консоль акаунта ззовні закриті (403).
    # Адмін відкриває консоль напряму через SSH-тунель на ВМ, повз шлюз.
    # Без урахування регістру (/idp/ADMIN) і з забороною «;», «\», %3B, %2F, %5C у шляху:
    # Keycloak може відкинути «;…» чи розкодувати слеш і віддати адмінку в обхід простого PathPrefix.
    # У звичайних шляхах Keycloak цих символів немає (перевірено тестом обходів).
    # Одинарні лапки YAML: усередині регулярного виразу «\\» — це буквальний «\».
    idp-blocked:
      rule: 'PathRegexp(`(?i)^/idp/+(admin|realms/+master|realms/+lad/+account)`) || PathRegexp(`(?i)^/idp.*(;|\\|%3b|%2f|%5c)`)'
      priority: 200
      entryPoints: [web]
      service: keycloak
      middlewares: [deny-external]

    tenant:
      rule: "PathPrefix(`/api/v1/tenant`)"
      priority: 100
      entryPoints: [web]
      service: tenant
      middlewares: [security-headers]

    school:
      rule: "PathPrefix(`/api/v1/school`)"
      priority: 100
      entryPoints: [web]
      service: school
      middlewares: [security-headers]

    timetable:
      rule: "PathPrefix(`/api/v1/timetable`)"
      priority: 100
      entryPoints: [web]
      service: timetable
      middlewares: [security-headers]

    # Сторінки за QR: без JWT, тому обмеження частоти запитів (429).
    public:
      rule: "PathPrefix(`/api/v1/public`)"
      priority: 100
      entryPoints: [web]
      service: timetable
      middlewares: [public-problem, public-rate-limit, security-headers]

  middlewares:
    security-headers:
      headers:
        contentTypeNosniff: true
        referrerPolicy: "no-referrer"
        # SAMEORIGIN, а не DENY: keycloak-js вбудовує iframe зі своєї ж адреси.
        customFrameOptionsValue: "SAMEORIGIN"
        # HSTS: браузер далі ходить лише по https (platform #18). Traefik додає заголовок лише
        # до відповідей по https, тож на http://localhost нічого не змінюється. Без includeSubdomains:
        # домен ВМ — піддомен чужого сервісу (DuckDNS, sslip.io).
        stsSeconds: 31536000

    deny-external:
      ipAllowList:
        sourceRange: ["127.0.0.1/32"]

    # 429 від ліміту — тілом problem+json з gateway-errors, код лишається 429 (розділ 07).
    public-problem:
      errors:
        status: ["429"]
        service: gateway-errors
        query: "/429.json"

    public-rate-limit:
      rateLimit:
        average: 10
        period: 1s
        burst: 20

  services:
    gateway-errors:
      loadBalancer:
        servers:
          - url: http://gateway-errors:8080
    web:
      loadBalancer:
        servers:
          - url: '{{ env "WEB_UPSTREAM" }}'
    keycloak:
      loadBalancer:
        servers:
          - url: '{{ env "KEYCLOAK_UPSTREAM" }}'
    tenant:
      loadBalancer:
        servers:
          - url: '{{ env "TENANT_UPSTREAM" }}'
    school:
      loadBalancer:
        servers:
          - url: '{{ env "SCHOOL_UPSTREAM" }}'
    timetable:
      loadBalancer:
        servers:
          - url: '{{ env "TIMETABLE_UPSTREAM" }}'
